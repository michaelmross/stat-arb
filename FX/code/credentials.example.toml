# Copy to credentials.toml (this directory) and fill in.
# credentials.toml is gitignored and must never be committed.
#
# Token: OANDA Account Management Portal -> Manage API Access -> Generate token.
# The account must be a PRACTICE (fxpractice) account; the code refuses to run
# against anything else. Account ids look like 101-001-1234567-001.
[oanda]
api_token  = "PUT-YOUR-PRACTICE-TOKEN-HERE"
account_id = "101-001-0000000-001"
