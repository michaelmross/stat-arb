# Scheduled macro releases to flag in the tick log (spec section 3).
# These are NOT filtered out of the census -- the flag only lets the analysis
# condition on regime.
#
# US Non-Farm Payrolls is handled by a deterministic rule in fxlib/sessions.py
# (first Friday of the month, 08:30 ET) and needs no entry here. For the Phase 1
# window that fires automatically on Fri 2026-09-04.
#
# when_local is America/New_York (the [sessions].timezone in config.toml), with
# no timezone suffix. Convert from the source timezone yourself and show the
# arithmetic in a comment -- a silent tz error would mislabel the busiest
# minutes of the sample.
#
# Everything below was verified against the official calendars on 2026-08-28 for
# the Phase 1 window 2026-08-31 .. 2026-09-11. Sources:
#   FOMC   https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   ECB    https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
#   BoE    https://www.bankofengland.co.uk/monetary-policy/upcoming-mpc-dates
#   US CPI https://www.bls.gov/schedule/news_release/cpi.htm
#
# Deliberately OUTSIDE the window, so no entries. All three were checked; do
# not add them without re-checking:
#   FOMC              2026-09-15/16
#   BoE               2026-09-17, 12:00 London
#   ONS labour market 2026-09-15, 07:00 London
#     (confirmed on https://www.ons.gov.uk/releases/uklabourmarketseptember2026,
#      which states "Release date: 15 September 2026 7:00am", not yet published)
#
# Two caveats on the entries below.
#
# 1. The euro-area flash HICP TIME is the conventional 11:00 CET/CEST; Eurostat
#    does not state a publication time on the release page, so only the DATE is
#    verified. Its window is widened to compensate.
#
# 2. UK monthly GDP (02:00 ET) and euro-area flash HICP (05:00 ET) both land in
#    the London morning, which is OUTSIDE the spec's overlap definition of
#    08:00-17:00 ET. They are flagged and logged, but they will not appear in an
#    analysis filtered with --sessions overlap. That is a property of the spec's
#    session definition, not a bug -- just do not conclude "no European data in
#    the sample" from an overlap-filtered run.

window_minutes = 15

# --- Interest rate decisions -------------------------------------------------

[[event]]
name       = "ECB"
# Governing Council monetary policy meeting 9-10 Sep, hosted by the Bundesbank
# in Berlin. Decision published 14:15 CEST = 12:15 UTC = 08:15 ET.
# Directly hits both legs of EUR/GBP, so this is the single most distorting
# scheduled event in the window.
when_local = "2026-09-10T08:15:00"
window_minutes = 30

[[event]]
name       = "ECB_presser"
# Press conference 14:45 CEST = 08:45 ET, runs roughly 45 minutes and moves the
# euro throughout, not just at the headline.
when_local = "2026-09-10T08:45:00"
window_minutes = 45

# --- US data -----------------------------------------------------------------

[[event]]
name       = "US_CPI"
# August 2026 CPI, released 08:30 ET on Fri 2026-09-11 -- the last day of the
# Phase 1 window.
when_local = "2026-09-11T08:30:00"
window_minutes = 30

# --- UK and euro-area data ---------------------------------------------------

[[event]]
name       = "UK_GDP_monthly"
# Monthly GDP estimate for July 2026 data, 07:00 London (BST, UTC+1)
# = 06:00 UTC = 02:00 ET, on Fri 2026-09-11 -- the same day as US CPI, so that
# Friday carries a GBP shock at 02:00 and a USD shock at 08:30.
# Confirmed: https://www.ons.gov.uk/releases/gdpmonthlyestimateukjuly2026
when_local = "2026-09-11T02:00:00"
window_minutes = 30

[[event]]
name       = "EZ_HICP_flash"
# Euro-area flash inflation estimate for August 2026, Tue 2026-09-01.
# Conventional release 11:00 CEST (UTC+2) = 09:00 UTC = 05:00 ET. Eurostat does
# not publish a time on the release page, so the window is 60 minutes rather
# than 30 to absorb the uncertainty in the time -- not the date, which is firm.
when_local = "2026-09-01T05:00:00"
window_minutes = 60

# --- Liquidity regime markers (not releases) ---------------------------------
# These are not scheduled announcements, but they change the liquidity regime
# for a whole session and the census should be able to condition on them.

[[event]]
name       = "US_holiday_LaborDay"
# Mon 2026-09-07. US desks closed; thin dollar liquidity all day, which widens
# spreads on both majors and starves the synchronized sample. Centred at midday
# with a 12-hour half-window so the flag covers the entire session.
when_local = "2026-09-07T12:00:00"
window_minutes = 720

[[event]]
name       = "month_end_fix"
# Mon 2026-08-31 is the last business day of August. Month-end rebalancing flow
# concentrates into the London 4pm fix = 11:00 ET, and is a well-documented
# distortion of spot FX. First day of the Phase 1 window.
when_local = "2026-08-31T11:00:00"
window_minutes = 30
